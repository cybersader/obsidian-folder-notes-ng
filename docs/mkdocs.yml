site_name: Folder Notes NG
theme:
  name: material
  logo: assets/folder-notes-ng.svg
  favicon: assets/folder-notes-ng.svg
  features:
    - navigation.expand
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list

plugins:
  - mkdocs-video
